<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#41574b;background:transparent}main{padding:18px;background:#f3ede1;min-height:100vh;overflow:auto;height:100vh;border:1px solid #a8aaa0;border-radius:12px}body.dark{color:#e1d9e4}body.dark main{background:#292831;border-color:#686172}header{display:flex;align-items:center;gap:6px}h1{font:18px serif;margin:0;flex:1}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:#89998033;border-radius:7px;padding:8px}input{width:100%;border:0;border-bottom:1px solid #a2a49a;background:#ffffff22;padding:8px}input::placeholder{color:#9998}fieldset{border:1px solid #a6aa9b;border-radius:5px;margin:18px 0;padding:14px}label{display:block;margin:10px 0}.row{display:flex;align-items:center;gap:7px}.row input{width:55px}.actions{display:flex;gap:4px;margin-top:12px}.actions button{font-size:12px}progress{width:100%;height:8px;accent-color:#657c68}.dark progress{accent-color:#ad92b5}.scene{height:145px;position:relative;display:flex;justify-content:center;align-items:center}.balloon{width:100px;height:120px;border-radius:50%;background:linear-gradient(135deg,#bf8caa,#68536d);display:flex;align-items:center;justify-content:center;color:white;transform-origin:center;transition:transform .5s}.drop{animation:drip 1.4s infinite;position:absolute;left:53%;top:40%;color:#7ca7a4}@keyframes drip{to{transform:translateY(38px);opacity:0}}.paused .drop{animation-play-state:paused;opacity:0}.plant{font-size:50px}.clock{text-align:center;font:28px monospace}.caption{text-align:center;font-size:11px;opacity:.75}.entry{padding:12px;border-bottom:1px solid #9994;cursor:pointer}.drag{-webkit-app-region:drag;cursor:move}.nodrag,button,input{-webkit-app-region:no-drag}#pet{cursor:pointer;text-align:center}body.pet main{background:transparent;border:0;padding:0}body.pet .scene{height:110px}body.compact main{padding:7px}body.compact .scene{height:50px;flex:1}body.compact .plant{font-size:28px}body.compact .balloon{width:38px;height:45px}body.compact .row{height:70px}.garden{width:100%;text-align:left;margin-top:18px}select{background:transparent;padding:7px;border:1px solid #9995;border-radius:5px}small{opacity:.7}
</style><body class="pet"><main id="app"></main>
<script>
const root=document.getElementById('app');let dark=false,mode='pet',page='timer',running=false,total=10800,left=10800,deadline=0,task='',plant='🌳',hours='',minutes='',selected=null;
let done=0;let archived;try{archived=JSON.parse(localStorage.getItem("focus.journal")||"{}")}catch{archived={}}
function archive(){const today=new Date().toLocaleDateString();for(const r of records){const day=new Date(r.date).toLocaleDateString();if(day!==today){archived[day]=records.filter(v=>new Date(v.date).toLocaleDateString()===day)}}localStorage.setItem("focus.journal",JSON.stringify(archived))}
let records;try{records=JSON.parse(localStorage.getItem('focus.records')||'[]');if(!Array.isArray(records))records=[]}catch{records=[]}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=()=>Math.max(0,Math.min(1,1-left/total));const clock=n=>[Math.floor(Math.ceil(n)/3600),Math.floor(Math.ceil(n)/60)%60,Math.ceil(n)%60].map(v=>String(v).padStart(2,'0')).join(':');
function scene(){let p=pct();return `<div class="scene ${running?'':'paused'}">${dark?`<div class="balloon" style="transform:scale(${1-p*.76},${left===0?.15:1-p*.76})">${left===0?'就这？':'•̀ᴗ•́'}</div>`:`<svg width="120" height="100" viewBox="0 0 120 100"><defs><clipPath id="pot"><path d="M20 20H75Q95 85 45 85Q0 85 20 20"/></clipPath></defs><path d="M20 20H75Q95 85 45 85Q0 85 20 20" fill="#eee6d9" stroke="#41574b" stroke-width="2"/><rect x="0" y="${85-(1-p)*65}" width="100" height="90" fill="#7da8a5" clip-path="url(#pot)"/><path d="M80 60L110 35L115 39L83 75M18 30Q-5 20 8 65L17 65" fill="none" stroke="#41574b" stroke-width="3"/></svg><span class="drop">💧</span><span class="plant">${p<.25?'🌱':p<.5?'🌿':p<.75?'🪴':plant}</span>`}</div>`}
function setMode(m){mode=m;page='timer';window.desktop?.mode(m);render()}
function save(){localStorage.setItem('focus.records',JSON.stringify(records))}
function tick(){if(new Date().toLocaleDateString()!==archiveDay){archive();archiveDay=new Date().toLocaleDateString()}if(running){left=Math.max(0,(deadline-Date.now())/1000);if(!left){running=false;records.unshift({id:crypto.randomUUID(),task:task.trim()||'未命名任务',seconds:total,done,date:new Date().toISOString(),dark,plant});save();window.desktop?.notify(dark?'就这？丢进垃圾桶了。':'新的收获已收入秘密花园');render()}document.querySelectorAll('[data-live]').forEach(e=>e.innerHTML=live());document.querySelectorAll('[data-scene]').forEach(e=>e.innerHTML=scene())}}
function live(){return `<div class="clock">${clock(left)}</div><div class="caption">已用 ${clock(total-left)}</div><progress max="1" value="${1-pct()}"></progress><div class="caption">已用 ${Math.floor(pct()*100)}% · 剩余 ${Math.ceil((1-pct())*100)}%</div>`}
function start(){if(running){tick();running=false}else{const h=Number(hours||0),m=Number(minutes||0);if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||m<0||m>59||h*60+m<1||h*60+m>10080)return alert('请填写1分钟至168小时，分钟为0–59');const n=h*3600+m*60;if(n!==total){total=n;left=n}if(left<=0)return;deadline=Date.now()+left*1000;running=true}render()}
function add(){let s=prompt(dark?'别急，还没完：增加几分钟？':'不够，再添点：增加几分钟？','5');if(s===null)return;let n=Number(s);if(!Number.isInteger(n)||n<=0||total+n*60>604800)return alert('请输入有效整数分钟，总时长最多168小时');tick();if(left<=0)return;total+=n*60;left+=n*60;if(running)deadline+=n*60000;hours=String(Math.floor(total/3600));minutes=String(total/60%60);render()}
function reset(){running=false;left=total;done=0;render()}
function render(){document.body.className=(dark?'dark ':'')+mode;if(mode==='pet'){root.innerHTML=`<div class="drag caption">⋯</div><div id="pet" onclick="setMode('detail')" data-scene>${scene()}</div><div class="caption">${dark?'糟心事':'点击，开始播种'}</div>`;return}if(mode==='compact'){root.innerHTML=`<div class="row"><span class="drag">☰</span><div onclick="setMode('detail')" style="flex:1;cursor:pointer" data-scene>${scene()}</div><button onclick="setMode('detail')">展开</button><button onclick="setMode('pet')">×</button></div>`;return}
root.innerHTML=`<header><h1 class="drag">${dark?'今天拿你出气。':'让未完成的事，慢慢生长'}</h1><button title="换个心情" onclick="dark=!dark;render()">${dark?'☘':'◕'}</button><button onclick="setMode('compact')">−</button><button onclick="setMode('pet')">×</button></header>`;
if(page==='garden'){root.innerHTML+=`<h3>${dark?'🗑 也就这点屁事':'🏡 我的秘密花园'}</h3><button onclick="page='timer';render()">返回计时</button> <button onclick="page='journal';render()">📖 每日手帐</button>`+records.map(r=>`<div class="entry" onclick="showRecord('${r.id}')">${r.dark?'🎈':r.plant} ${esc(r.task)}<small> · ${r.seconds/60}分钟</small></div>`).join('');return}
if(page==='journal'){let groups={};for(let r of records){let d=new Date(r.date).toLocaleDateString();(groups[d]??=[]).push(r)}root.innerHTML+=`<h3>每日手帐</h3><button onclick="page='garden';render()">返回收藏</button><p><small>完成记录按本地日期归档</small></p>`+Object.entries(groups).map(([d,rs])=>`<h4>${esc(d)} · ${rs.reduce((s,r)=>s+r.seconds,0)/60}分钟</h4>`+rs.map(r=>`<div class="entry">${esc(r.task)} · ${r.seconds/60}分钟</div>`).join('')).join('');return}
root.innerHTML+=`<fieldset><label>${dark?'这次是什么破事':'来，种点什么'}<input id="task" placeholder="输入任务名称，例如：阅读20页" value="${esc(task)}"></label><div class="row">${dark?'给它多久':'蓄水量'}<input id="hours" placeholder="0" inputmode="numeric" value="${esc(hours)}" ${running?'disabled':''}>小时<input id="minutes" placeholder="0" inputmode="numeric" value="${esc(minutes)}" ${running?'disabled':''}>分钟</div>${dark?'':`<label>我想浇灌 <select id="plant" ${running||pct()>0&&left>0?'disabled':''}>${['🌳','🌻','🌷','🌼'].map(p=>`<option ${p===plant?'selected':''}>${p}</option>`).join('')}</select></label>`}<div class="actions"><button onclick="start()">${running?'暂停':left<total?'继续':dark?'让它漏气':'开始浇灌'}</button><button onclick="reset()">${dark?'重新来':'重新蓄水'}</button>${running||pct()>0&&left>0?`<button onclick="add()">${dark?'别急，还没完':'不够，再添点'}</button>`:''}</div></fieldset><div data-live>${live()}</div><div data-scene>${scene()}</div><div class="caption">${dark?'🎈 ⇢ 🎈 ⇢ 🎈 ⇢ 就这？':'🌱 ⇢ 🌿 ⇢ 🪴 ⇢ '+plant}</div><details><summary>查看任务进度</summary><label>任务完成率 <span id=doneText>${done}%</span><input type=range min=0 max=100 value=${done} oninput="done=Number(this.value);document.getElementById('doneText').textContent=done+'%'"></label></details><button class="garden" onclick="page='garden';render()">${dark?'🗑 也就这点屁事':'🏡 我的秘密花园'} · ${records.length}份记录 →</button><p class="caption"><button onclick="window.desktop?window.desktop.quit():window.close()">退出 Focus</button></p>`;
for(let id of ['task','hours','minutes','plant']){let e=document.getElementById(id);if(e)e.oninput=()=>{if(id==='task')task=e.value;if(id==='hours')hours=e.value;if(id==='minutes')minutes=e.value;if(id==='plant')plant=e.value}}
}
function showRecord(id){let r=records.find(r=>r.id===id);if(r)alert(`${r.task}\n${r.seconds/60}分钟\n${new Date(r.date).toLocaleString()}\n${r.dark?'就这？':r.plant}`)}
archive();let archiveDay=new Date().toLocaleDateString();setInterval(tick,250);render();
</script></body></html>
